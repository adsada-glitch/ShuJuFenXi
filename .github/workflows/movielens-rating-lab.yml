name: MovieLens Rating Lab

on:
  push:
    paths:
      - 'MovieLensRatingLab/**'
      - '.github/workflows/movielens-rating-lab.yml'
  pull_request:
    paths:
      - 'MovieLensRatingLab/**'
      - '.github/workflows/movielens-rating-lab.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    defaults:
      run:
        working-directory: MovieLensRatingLab
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: MovieLensRatingLab/pyproject.toml
      - run: python -m pip install -e .
      - run: python -m unittest discover -s tests -v
