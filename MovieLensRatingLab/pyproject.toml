[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "movielens-rating-lab"
version = "0.1.0"
description = "A reproducible learning lab for temporal rating prediction and uncertainty"
requires-python = ">=3.11"
dependencies = ["numpy==2.2.6", "pandas==2.3.3", "matplotlib==3.10.7"]

[project.optional-dependencies]
notebook = ["jupyterlab>=4,<5", "ipykernel>=6,<8"]

[tool.setuptools.packages.find]
where = ["src"]
