<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>淘宝用户行为 · 实时分析实验</title>
<style>*{box-sizing:border-box}body{margin:0;background:#f3f6fa;color:#172b42;font:15px/1.6 system-ui,"Microsoft YaHei",sans-serif}main{max-width:1240px;margin:auto;padding:32px}h1{font-size:30px;margin:5px 0}h2{font-size:19px}.eyebrow{color:#087e8b;letter-spacing:2px}small,.muted{color:#65758b}.cards{display:grid;grid-template-columns:repeat(4,1fr);gap:16px;margin:24px 0}.card,section{background:white;border:1px solid #dde5ee;border-radius:12px;padding:20px}.number{font-size:29px;font-weight:700}.grid{display:grid;grid-template-columns:1fr 1fr;gap:18px}table{width:100%;border-collapse:collapse}td,th{text-align:left;padding:8px;border-bottom:1px solid #eef2f6}th{color:#64748b;font-size:13px}.scroll{max-height:390px;overflow:auto}.bar{height:14px;border-radius:4px;background:#168b9b;min-width:2px}.barrow{display:grid;grid-template-columns:155px 1fr 45px;gap:9px;align-items:center;font-size:12px;margin:6px 0}#status{padding:10px;background:#e4f3ee;border-radius:8px;margin-top:14px}select{padding:8px;border:1px solid #cbd5e1;border-radius:6px}footer{margin:20px 0;color:#64748b}@media(max-width:800px){.grid{grid-template-columns:1fr}.cards{grid-template-columns:repeat(2,1fr)}main{padding:16px}.barrow{grid-template-columns:70px 1fr 45px}}</style>
<main><div class="eyebrow">TAOBAO · STREAM ANALYTICS</div><h1>从用户行为到可核对的指标</h1><div class="muted" id="meta"></div><div id="status">正在读取结果…</div><div class="cards" id="cards"></div>
<div class="grid"><section><h2>行为构成</h2><div id="behaviors"></div><p class="muted">次数分布不等于转化漏斗；购买记录不等于订单。</p></section><section><h2>类目购买行为 Top 10</h2><table><thead><tr><th>匿名类目 ID</th><th>购买行为次数</th></tr></thead><tbody id="categories"></tbody></table></section><section><h2>每小时购买行为</h2><select id="day"></select><div id="hours"></div></section><section><h2>5 分钟事件时间窗口</h2><div class="scroll"><table><thead><tr><th>窗口开始（北京时间）</th><th>PV</th><th>UV</th><th>购买用户</th></tr></thead><tbody id="windows"></tbody></table></div></section></div>
<section><h2>当日累计 UV（每 10 分钟更新）</h2><p class="muted">每天从零累计，跨日不可相加；有界回放展示各窗口最终结果。</p><div class="scroll"><table><thead><tr><th>窗口结束（北京时间）</th><th>当日累计独立用户</th></tr></thead><tbody id="cumulative"></tbody></table></div></section><footer>数据为历史 CSV 回放。样本不是随机抽样，不外推淘宝整体。窗口 UV 不能跨窗口直接相加。所有时间使用 Asia/Shanghai。仅供本地实验。</footer></main>
<script>const embedded=/*REPORT*/null;let last=null;const el=id=>document.getElementById(id);const fmt=x=>Number(x||0).toLocaleString('zh-CN');function row(parent,values){let tr=document.createElement('tr');values.forEach(v=>{let td=document.createElement('td');td.textContent=v;tr.append(td)});parent.append(tr)}function bars(id,items){const box=el(id);box.replaceChildren();let max=Math.max(1,...items.map(x=>x[1]));items.forEach(([label,value])=>{let r=document.createElement('div');r.className='barrow';let a=document.createElement('span');a.textContent=label;let b=document.createElement('div');b.className='bar';b.style.width=(value/max*100)+'%';let c=document.createElement('span');c.textContent=fmt(value);r.append(a,b,c);box.append(r)})}function hourChart(){const h=last?.actual?.hours||{};bars('hours',Object.entries(h).filter(([k])=>k.startsWith(el('day').value)).sort(([a],[b])=>a.localeCompare(b)))}function render(r){last=r;const a=r.actual||{},o=a.overall||{};el('meta').textContent=`运行批次：${r.run||'未运行'} · 来源：${r.source||'未知'}${r.last_update?' · 最近更新：'+r.last_update:''}`;el('status').textContent=r.error?'读取异常：'+r.error:r.passed===true?'已通过 Python / Flink 五组结果逐项对账':r.passed===false?'存在对账差异，请查看 reports/result.json':'实时变化中，尚未完成最终对账';el('cards').replaceChildren();[['行为总数',fmt(o.total_events)],['活跃用户 UV',fmt(o.active_users)],['购买用户',fmt(o.buyers)],['购买用户占比',o.active_users?(100*o.buyers/o.active_users).toFixed(2)+'%':'—']].forEach(([label,value])=>{let c=document.createElement('div');c.className='card';let title=document.createElement('div');title.textContent=label;let n=document.createElement('div');n.className='number';n.textContent=value;c.append(title,n);el('cards').append(c)});bars('behaviors',[['浏览 PV',o.pv||0],['收藏',o.fav||0],['加购',o.cart||0],['购买行为',o.buy_events||0]]);el('categories').replaceChildren();Object.entries(a.categories||{}).sort((x,y)=>y[1]-x[1]||x[0].localeCompare(y[0])).slice(0,10).forEach(([k,v])=>row(el('categories'),[k,fmt(v)]));el('windows').replaceChildren();Object.entries(a.windows||{}).sort(([a],[b])=>a.localeCompare(b)).forEach(([k,v])=>row(el('windows'),[k,fmt(v.pv),fmt(v.active_users),fmt(v.buyers)]));el('cumulative').replaceChildren();Object.entries(a.cumulative||{}).sort(([a],[b])=>a.localeCompare(b)).forEach(([k,v])=>row(el('cumulative'),[k,fmt(v)]));let selected=el('day').value;el('day').replaceChildren();[...new Set(Object.keys(a.hours||{}).map(k=>k.slice(0,10)))].sort().forEach(d=>{let op=document.createElement('option');op.value=d;op.textContent=d;el('day').append(op)});if([...el('day').options].some(o=>o.value===selected))el('day').value=selected;hourChart()}el('day').onchange=hourChart;async function refresh(){try{let resp=await fetch('/api');if(!resp.ok)throw Error(resp.status);render(await resp.json())}catch(e){el('status').textContent='无法读取服务：'+e.message}}if(embedded)render(embedded);else{refresh();setInterval(refresh,3000)}</script></html>
